---
- name: Configure Layer 2 technologies covered in ENCOR blueprint
  hosts: switches
  gather_facts: false
  vars_files:
    - vault.yml

  tasks:
    - name: Configure VLANs on switches
      cisco.ios.ios_vlans:
        config:
          - name: DATA_VLAN
            vlan_id: 10
          - name: VOICE_VLAN
            vlan_id: 20
          - name: VIDEO_VLAN
            vlan_id: 30

- name: Default Copy run start on completion of playbook changes
  hosts: switches
  gather_facts: false
  vars_files:
    - vault.yml
  
  tasks:
    - name: Copy running config to startup config after changes
      cisco.ios.ios_config:
        save_when: modified