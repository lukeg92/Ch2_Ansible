stages:
  - lint
  - test
  - deploy

# Global variables used across pipeline jobs
variables:
  # This points the runner directly to your custom virtual environment binary
  ANSIBLE_RUNNER: "/home/luke/AUTOCOR/Ch2_Ansible/.venv/bin/ansible-playbook"
  ANSIBLE_FORCE_COLOR: "True"

# 1. Syntax Check: Validates your Ansible code structure
ansible_syntax_check:
  stage: lint
  tags:
    - cml-runner
  script:
    - echo "Verifying Ansible playbook syntax..."
    - $ANSIBLE_RUNNER --syntax-check -i inventory.yml task.yml

# 2. Dry Run: Simulates the changes against your CML nodes without changing state
ansible_dry_run:
  stage: test
  tags:
    - cml-runner
  script:
    - echo "Executing dry-run simulation against CML lab..."
    - $ANSIBLE_RUNNER -i inventory.yml task.yml --check --diff
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

# 3. Production Push: Applies the changes completely to your CML network devices
cml_live_deploy:
  stage: deploy
  tags:
    - cml-runner
  script:
    - echo "Deploying active network configuration updates..."
    - $ANSIBLE_RUNNER -i inventory.yml task.yml
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
