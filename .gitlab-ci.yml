stages:
  - validate
  - lab

default:
  image: ansible-ci:1
  tags:
    - cml-docker
  before_script:
    - mkdir -p ~/.ssh
    - cp known_hosts ~/.ssh/known_hosts

yamllint:
  stage: validate
  script:
    - yamllint copy_run_start.yml l2_access_distribution_configs_playbook.yml l2_access_switch_configs_playbook.yml l2_distribution_switch_configs_playbook.yml ping_test.yml inventory.yml

ansible_lint:
  stage: validate
  script:
    - ansible-lint copy_run_start.yml l2_access_distribution_configs_playbook.yml l2_access_switch_configs_playbook.yml l2_distribution_switch_configs_playbook.yml ping_test.yml

syntax_check:
  stage: validate
  script:
    - |
      for playbook in copy_run_start.yml l2_access_distribution_configs_playbook.yml l2_access_switch_configs_playbook.yml l2_distribution_switch_configs_playbook.yml ping_test.yml; do
        echo "Checking $playbook"
        ansible-playbook -i inventory.yml "$playbook" --syntax-check
      done

connectivity:
  stage: lab
  script:
    - ansible-playbook -i inventory.yml ping_test.yml
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

dry_run:
  stage: lab
  needs: [connectivity]
  script:
    - for v in LAB_USER LAB_PASSWORD; do [ -n "$(printenv $v)" ] && echo "$v set" || echo "$v EMPTY"; done
    - ansible-playbook -i inventory.yml l2_ssh access_distribution_configs_playbook.yml --check --diff
    - ansible-playbook -i inventory.yml l2_access_switch_configs_playbook.yml --check --diff
    - ansible-playbook -i inventory.yml l2_distribution_switch_configs_playbook.yml --check --diff
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:
  stage: lab
  needs: [dry_run]
  script:
    - ansible-playbook -i inventory.yml l2_access_distribution_configs_playbook.yml
    - ansible-playbook -i inventory.yml l2_access_switch_configs_playbook.yml
    - ansible-playbook -i inventory.yml l2_distribution_switch_configs_playbook.yml
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
