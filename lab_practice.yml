---
- name: Switches configure VLANS & interfaces and save Configuration
  gather_facts: false
  hosts: switches
  vars_files:
    - vault.yml
  
  tasks:
    - name: Configure VLAN 10, 20, and 30 on Switches 1 and 2
      cisco.ios.ios_vlans:
        config:
          - name: Printer
            vlan_id: 10
          - name: Camera
            vlan_id: 20
          - name: Guest
            vlan_id: 30
        state: merged

    - name: Configure L2 Switch interfaces
      cisco.ios.ios_l2_interfaces:
        config:
          - name: Ethernet0/1
            mode: access
            access:
              vlan: 10
          - name: Ethernet0/2
            mode: trunk
            trunk:
              allowed_vlans: 10,20,30
              encapsulation: dot1q
          - name: Ethernet0/3
            mode: trunk
            trunk:
              allowed_vlans: 10,20,30
              encapsulation: dot1q
        state: merged

    - name: Save runnig config to startup config after changes
      cisco.ios.ios_config:
        save_when: modified

- name: Routers configure interfaces and save Configuration
  gather_facts: false
  hosts: routers
  vars_files:
    - vault.yml  

  tasks:
    - name: Configure L3 interface IP address
      cisco.ios.ios_l3_interfaces:
        config:
          - name: Ethernet0/1
            ipv4:
              - address: "{{ eth1addr }}"
        state: merged
    
    - name: Enable router interfaces
      cisco.ios.ios_interfaces:
        config:
          - name: "{{ item }}"
            description: Configured and merged by ansible
            enabled: true
        state: merged
      loop:
        - Ethernet0/1
        - Ethernet0/2
        - Ethernet0/3

    - name: Configure OSPF on routers
      cisco.ios.ios_ospfv2:
        config:
          processes:
            - process_id: 1
              network:
                - address: 192.168.1.0
                  wildcard_bits: 0.0.0.255
                  area: 0

    - name: Save runnig config to startup config after changes
      cisco.ios.ios_config:
        save_when: modified
