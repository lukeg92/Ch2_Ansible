---
- name: Configure Layer 2 technologies on access switches - technologies covered in ENCOR blueprint
  hosts: access_switches
  gather_facts: false
  vars_files:
    - vault.yml
  
  tasks:
    - name: configure access ports #Eth1/1, 1/2, 1/3
      cisco.ios.ios_l2_interfaces:
        config:
          - name: Ethernet1/1
            mode: access
            access:
              vlan: 11
            voice:
              vlan: 20
          - name: Ethernet1/2
            mode: access
            access:
              vlan: 12
            voice:
              vlan: 20
          - name: Ethernet1/3
            mode: access
            access: 
              vlan: 13
            voice:
              vlan: 20

    - name: configure trunk ports #Eth0/1
      cisco.ios.ios_l2_interfaces:
        config:
          - name: Ethernet0/1
            mode: trunk
            trunk:
              allowed_vlans: 10,11,12,13,20,30
              native_vlan: 10
              encapsulation: dot1q         