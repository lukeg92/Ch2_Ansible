---
all:
  children:
    switches:
      hosts:
        Collapsed_Core_Switch_1:
          ansible_host: 192.168.200.150
        Collapsed_Core_Switch_2:
          ansible_host: 192.168.200.151
        Access_Switch_1:
          ansible_host: 192.168.200.152
        Access_Switch_2:
          ansible_host: 192.168.200.153
    access_switches:
      hosts:
        Access_Switch_1: {}
        Access_Switch_2: {}
    distribution_switches:
      hosts:
        Collapsed_Core_Switch_1: {}
        Collapsed_Core_Switch_2: {}

  vars:
    ansible_connection: network_cli
    ansible_network_os: ios
    ansible_user: "{{ LAB_USER }}"
    ansible_password: "{{ LAB_PASSWORD }}"
    ansible_secret: "{{ LAB_SECRET }}"