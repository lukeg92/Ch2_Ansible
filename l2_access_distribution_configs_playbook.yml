---
- name: Configure Layer 2 technologies on access and distribution switches - technologies covered in ENCOR blueprint
  hosts: switches
  gather_facts: false

  tasks:
    - name: Configure VLANs on access and distribution switches
      cisco.ios.ios_vlans:
        config:
          - name: DATA_VLAN
            vlan_id: 10
          - name: IT_VLAN
            vlan_id: 11
          - name: HR_VLAN
            vlan_id: 12
          - name: FINANCE_VLAN
            vlan_id: 13
          - name: VOICE_VLAN
            vlan_id: 20
          - name: VIDEO_VLAN
            vlan_id: 30
